version: 1
document:
  id: android-spatial-scroller-boilerplate-v1
  title: Android Spatial Scroller Boilerplate
  purpose: >
    Provide a small, local-first Android foundation for a spatial card
    scroller while keeping the normal development loop command-line-first,
    test-driven, and suitable for autonomous implementation in increments.
  scope: boilerplate-foundation
  target_path: /home/jolopez/work/droid-scroller-boilerplate
  source_inputs:
    - docs/archive/interest-space-concept-user-stories.md
    - docs/archive/studio-session-user-stories.md
    - docs/archive/android-cli-tdd-user-stories.yaml
    - docs/archive/helloworld-format-example--user-stories.md

principles:
  - Local-first core behavior does not require an account or cloud service.
  - Product behavior is expressed as small, independently verifiable increments.
  - Domain and application logic should be testable on the JVM whenever possible.
  - The terminal, Gradle, Git, and tests form the normal development loop.
  - Android runtime and physical-device checks validate Android-specific behavior
    without blocking the inner TDD loop.
  - Spatial effects should support comprehension and interaction rather than
    become prerequisites for the first functional slice.

interaction_model:
  horizontal_axis:
    purpose: switch_between_interests
    behavior:
      - Swiping horizontally changes the active interest.
      - The active interest is clearly identifiable.
  vertical_axis:
    purpose: navigate_cards_within_an_interest
    modes:
      finite:
        behavior:
          - Moving forward stops at the last card.
          - Moving backward stops at the first card.
          - A card can be inserted at either end so the sequence can grow.
      loop:
        behavior:
          - Moving forward from the last card reaches the first card.
          - Moving backward from the first card reaches the last card.
    selection: configurable
  hold_actions:
    gesture: press_and_hold
    initial_threshold_ms: 1500
    behavior:
      - Holding a focused card opens an action surface.
      - The action surface offers insert and delete actions.
      - Deleting requires an explicit confirmation or reversible undo.
      - Releasing before the threshold does not open the action surface.

user_stories:
  - id: US-001
    title: Bootstrap the Android project from the command line
    category: developer
    priority: P0
    status: completed
    story:
      as_a: developer
      i_want: to create and configure the Android project from the command line
      so_that: Android Studio is not required to begin the normal development loop
    acceptance_criteria:
      - The project has a valid Gradle configuration.
      - The required JDK and Android SDK configuration can be checked from the terminal.
      - The project can be opened later in Android Studio without restructuring.
    increments:
      - Define the minimal Android project structure.
      - Add or verify the Gradle wrapper and debug build configuration.
      - Document the required command-line prerequisites.
    verification:
      automated:
        - ./gradlew tasks
        - ./gradlew assembleDebug
      device: []

  - id: US-00A
    title: Implement each increment with TDD (Foundation)
    category: developer
    priority: P0
    status: completed
    story:
      as_a: developer
      i_want: each user-story increment to follow red-green-refactor
      so_that: behavior is developed in small, reviewable steps
    acceptance_criteria:
      - A failing test or reproducible check exists before the implementation change.
      - The smallest implementation needed to pass is introduced.
      - Relevant tests are rerun after implementation.
      - Refactoring preserves green tests.
      - Each meaningful increment can be reviewed and committed independently.
    increments:
      - Select one acceptance criterion.
      - Add the smallest failing test.
      - Implement the minimum behavior.
      - Refactor only after the test is green.
      - Record automated and device verification separately.
    verification:
      automated:
        - ./gradlew test
      device: []

  - id: US-00B
    title: Keep application logic JVM-testable (Foundation)
    category: developer
    priority: P0
    status: completed
    story:
      as_a: developer
      i_want: navigation and card rules to run without the Android runtime
      so_that: the inner TDD loop remains fast and deterministic
    acceptance_criteria:
      - Navigation, insertion, deletion, and mode rules can be tested on the JVM.
      - Business rules do not unnecessarily depend on Android framework APIs.
      - Android-specific code is isolated behind clear boundaries.
      - Fakes or test doubles can exercise persistence and time-dependent behavior.
    increments:
      - Separate domain state transitions from UI gesture handling.
      - Define interfaces for persistence and platform-dependent effects.
      - Add JVM tests for each state transition.
    verification:
      automated:
        - ./gradlew test
      device: []

  - id: US-00C
    title: Verify the project from one command (Foundation)
    category: developer
    priority: P0
    status: completed
    story:
      as_a: developer
      i_want: one command to run the project's automated checks
      so_that: I can decide whether an increment is ready to review
    acceptance_criteria:
      - The command runs unit tests.
      - The command runs linting when configured.
      - The command builds the debug application.
      - The command returns a non-zero exit code on failure.
      - The command prints enough context to identify the failed stage.
    increments:
      - Define the verification command using existing Gradle tasks.
      - Add or document the command as part of the project workflow.
      - Exercise both success and failure paths.
    verification:
      automated:
        - ./gradlew test
        - ./gradlew lint
        - ./gradlew assembleDebug
      device: []

  - id: US-002
    title: Display a minimal spatial scroller
    category: product
    priority: P0
    status: completed
    story:
      as_a: user
      i_want: to see a focused card with neighboring cards partially visible
      so_that: I can understand the current position in a spatial sequence
    acceptance_criteria:
      - A focused card is rendered.
      - At least one neighboring card can be partially visible when available.
      - The focused card is visually more prominent than its neighbors.
      - Transitioning between cards preserves a single focused position.
    increments:
      - Model a sequence of cards and a focused index.
      - Render the focused card and neighboring cards.
      - Add a deterministic transition between adjacent cards.
    verification:
      automated:
        - JVM tests cover focused-index and neighbor-selection behavior.
        - A UI test or screenshot check covers the initial focused state.
      device:
        - Confirm the focused card and neighboring peek are legible on a physical device.

  - id: US-003
    title: Navigate between interests horizontally
    category: product
    priority: P0
    status: completed
    story:
      as_a: user
      i_want: to swipe horizontally between interests
      so_that: I can move through separate personal spaces
    acceptance_criteria:
      - Horizontal navigation changes the active interest.
      - The active interest is clearly identifiable.
      - Navigation behaves correctly with one, two, and many interests.
      - Horizontal navigation does not unexpectedly change the focused card within an interest.
    increments:
      - Define interest and active-interest state.
      - Test single-interest and boundary behavior.
      - Connect horizontal gesture state to the active-interest state.
    verification:
      automated:
        - JVM tests cover active-interest transitions and boundaries.
        - UI tests cover horizontal navigation state.
      device:
        - Confirm horizontal navigation is distinguishable from vertical navigation.

  - id: US-004
    title: Navigate cards with finite vertical scrolling
    category: product
    priority: P0
    status: completed
    story:
      as_a: user
      i_want: vertical navigation to stop at the ends in finite mode
      so_that: I know when I have reached the beginning or end of an interest
    acceptance_criteria:
      - Moving forward stops at the final card.
      - Moving backward stops at the first card.
      - Boundary attempts do not produce an invalid index or blank focused state.
      - The current position remains understandable.
    increments:
      - Define finite navigation state and bounds.
      - Test forward and backward boundary behavior.
      - Expose the selected navigation mode to the presentation layer.
    verification:
      automated:
        - JVM tests cover empty, single-card, and multi-card sequences.
        - JVM tests cover both boundaries and repeated boundary attempts.
      device:
        - Confirm end-of-sequence behavior is understandable during vertical swipes.

  - id: US-004-MILESTONE
    title: Device validation checkpoint - Vertical navigation
    category: developer
    priority: P1
    status: completed
    story:
      as_a: developer
      i_want: to validate vertical navigation and card transitions on a physical device
      so_that: gesture responsiveness and visual feedback are verified before continuing
    acceptance_criteria:
      - A debug APK can be built and installed using ADB.
      - Vertical navigation (forward/backward) works smoothly on device.
      - Card boundaries and transitions are visually understandable.
      - Android-specific issues are recorded as follow-up story increments.
    increments:
      - Build and install debug APK to physical device.
      - Exercise vertical navigation (swipes and boundaries).
      - Verify transition animations are smooth and not glitchy.
      - Record any visual or gesture defects for resolution.
    verification:
      automated:
        - ./gradlew assembleDebug
      device:
        - adb devices
        - adb install -r app/build/outputs/apk/debug/app-debug.apk
        - adb shell am start -n com.jtonomous.droidscroller/.MainActivity
        - Manual swipe testing: forward, backward, and boundary attempts
        - Confirm animations and visual hierarchy are correct

  - id: US-004-USER-FEEDBACK
    title: Refine seeded content and vertical card controls from device feedback
    category: product
    priority: P0
    status: completed
    story:
      as_a: user
      i_want: the initial interests, card focus, and controls to match the spatial browsing model
      so_that: the first screen communicates both horizontal interests and vertical cards clearly
    acceptance_criteria:
      - The default interests are ordered Board games, Running, Photography.
      - The default cards are Texas Hold'em, Blackjack, Exploding Kittens; Park, Trail, Marathon; and City, National Park, Gallery.
      - The app starts on Running, the middle interest.
      - Each default interest starts on its second card.
      - The initial card stack exposes the first, focused, and third cards when available.
      - The card controls use vertical-navigation labels: `Previous card` and `Next card`.
      - `Next card` is the absolute top control.
      - `Previous card` remains below the card stack.
      - Interest controls remain at the bottom.
    increments:
      - Replace the development seed interests and cards.
      - Initialize the middle interest and second-card focus.
      - Rename and reposition the card controls without changing swipe behavior.
      - Add focused JVM/UI coverage for the refined initial state and controls.
    verification:
      automated:
        - JVM tests cover default interest order, initial active index, and per-interest focused index.
        - UI tests cover the control labels and placement.
      device:
        - Confirm the refined launch state and control placement on a physical device.

  - id: US-004-REFINE-B
    title: Configure optional navigation buttons from settings
    category: product
    priority: P0
    status: completed
    story:
      as_a: user
      i_want: navigation buttons to be optional and configurable from settings
      so_that: swipe navigation remains the uncluttered default while button access is available when needed
    acceptance_criteria:
      - Swipe navigation remains available regardless of the navigation-button setting.
      - Card and interest navigation buttons are hidden by default.
      - A small settings control is visible near the lower-left area of the main screen.
      - Settings provides a `Navigation buttons` option.
      - Enabling the option shows the card and interest navigation buttons.
      - Disabling the option hides the card and interest navigation buttons.
      - The settings surface provides an explicit return action to the main screen.
      - `Next card` and `Previous card` invoke the requested vertical actions after their callbacks are corrected.
    increments:
      - Add testable settings state for menu visibility and navigation-button visibility.
      - Add the settings control, menu, toggle, and return action.
      - Hide navigation buttons by default and restore them when enabled.
      - Correct card-button callback direction without changing swipe direction.
      - Add Compose UI coverage for settings entry, exit, toggle behavior, and control visibility.
    verification:
      automated:
        - JVM tests cover settings state transitions.
        - Compose UI tests cover default hidden controls, settings entry/exit, and toggle behavior.
      device:
        - Confirm the default screen shows only the settings control.
        - Confirm enabling navigation buttons reveals all card and interest controls.

  - id: US-005
    title: Navigate cards with looping vertical scrolling
    category: product
    priority: P0
    status: ready
    story:
      as_a: user
      i_want: vertical navigation to loop in loop mode
      so_that: I can continuously browse an interest without a hard stop
    acceptance_criteria:
      - Moving forward from the final card selects the first card.
      - Moving backward from the first card selects the final card.
      - Looping does not duplicate or delete cards.
      - Switching modes preserves valid content and focused state.
    increments:
      - Define modular index transitions.
      - Test both wraparound directions.
      - Test switching between finite and loop modes.
      - Treat navigation buttons as optional controls; swipe navigation remains the default interaction.
    verification:
      automated:
        - JVM tests cover wraparound and mode changes.
        - UI tests cover loop behavior with navigation buttons hidden by default.
      device:
        - Confirm loop transitions feel continuous and do not expose a visual glitch.

  - id: US-006
    title: Add a card to the top of an interest
    category: product
    priority: P0
    status: completed
    story:
      as_a: user
      i_want: to add a named card to the top of the current stack
      so_that: an interest can grow while finite navigation remains useful
    acceptance_criteria:
      - A fixed plus (+) control is available at the top of the main view.
      - Pressing the plus control opens a compact add-card dialog.
      - The dialog accepts a card name and provides Cancel and OK actions.
      - Confirming a non-blank name inserts the new card at the top of the active interest's card stack.
      - After insertion, the new card is focused in the main view.
      - Canceling or dismissing the dialog does not change the card sequence.
      - Existing cards retain their order and content.
    increments:
      - Define card identity and insertion operations.
      - Test top insertion and focus behavior, including an empty sequence.
      - Connect the fixed plus control to a compact add-card dialog.
      - Validate the dialog's cancel, confirmation, and blank-name behavior.
    verification:
      automated:
        - JVM tests cover ordering, identity, and focused-position rules.
      device:
        - Confirm the plus control, dialog, and top-stack insertion are understandable on device.

  - id: US-007
    title: Delete a focused card safely
    category: product
    priority: P0
    status: ready
    story:
      as_a: user
      i_want: to delete the focused card through an explicit action
      so_that: I can curate an interest without accidental data loss
    acceptance_criteria:
      - Pressing and holding a focused card opens card actions after the configured threshold.
      - Releasing before the threshold does not open card actions.
      - Delete requires confirmation or provides an immediate undo.
      - Deleting the only card leaves a valid empty state.
      - Deleting a card selects a deterministic neighboring focus.
    increments:
      - Model press duration and cancellation.
      - Add the action surface with insert and delete choices.
      - Test delete confirmation/undo and empty-state behavior.
    verification:
      automated:
        - JVM tests cover hold threshold and cancellation.
        - JVM tests cover delete behavior for first, middle, last, and only cards.
      device:
        - Confirm the hold gesture is discoverable and does not trigger accidentally.

  - id: US-008
    title: Persist interests and cards locally
    category: product
    priority: P0
    status: in_progress
    story:
      as_a: user
      i_want: my interests and cards to survive app restarts
      so_that: the boilerplate is useful without an account or cloud service
    acceptance_criteria:
      - Data survives process and app restarts.
      - The active interest and focused card are restored after relaunch.
      - Core browsing and editing work without an account.
      - User content is not sent to a remote service by default.
      - Persistence failures are surfaced rather than silently ignored.
    increments:
      - Define serializable local data models.
      - Add a local persistence boundary behind an interface.
      - Test save/load and empty-state behavior on the JVM.
      - Connect persistence to the Android lifecycle.
    verification:
      automated:
        - JVM tests cover round-trip persistence of interests, cards, active interest, and focused card.
        - JVM tests cover malformed/empty data handling.
        - Android tests cover persistence across recreation where practical.
      device:
        - Confirm data remains after force-close and relaunch.

  - id: US-008-MILESTONE
    title: Device validation checkpoint - Full editing workflow
    category: developer
    priority: P1
    status: ready
    story:
      as_a: developer
      i_want: to validate the complete editing and persistence workflow on a physical device
      so_that: user interactions, data durability, and app lifecycle behavior are verified
    acceptance_criteria:
      - A debug APK can be built and installed using ADB.
      - Full editing workflow (insert, delete, navigate, persist) works on device.
      - Data survives app restart, force-close, and relaunch.
      - Android lifecycle integration is correct and data is not lost.
    increments:
      - Build and install debug APK to physical device.
      - Perform a full workflow: navigate, insert cards, delete cards, navigate again.
      - Force-close the app and verify data is preserved.
      - Restart the app and confirm the state is restored correctly.
      - Record any data loss or state corruption issues.
    verification:
      automated:
        - ./gradlew assembleDebug
      device:
        - adb devices
        - adb install -r app/build/outputs/apk/debug/app-debug.apk
        - adb shell am start -n com.jtonomous.droidscroller/.MainActivity
        - Manual testing: Insert, delete, navigate, force-close (adb shell am force-stop), relaunch
        - Verify data integrity and correct state restoration
        - Check adb logcat for any persistence errors

  - id: US-009
    title: Apply responsive spatial presentation
    category: product
    priority: P1
    status: in_progress
    story:
      as_a: user
      i_want: card spacing and transformations to adapt to screen size
      so_that: the scroller remains usable on phones and tablets
    acceptance_criteria:
      - Layout calculations use available size rather than fixed device dimensions.
      - When available, up to two neighboring cards are visible above and below the focused card.
      - The focused card uses the largest scale and strongest opacity.
      - The first neighbors use the current secondary scale and opacity.
      - The second neighbors use a smaller scale and lower opacity than the first neighbors.
      - Focused content remains readable at supported sizes.
      - Transform calculations are deterministic for a given layout and relative position.
    increments:
      - Extract size-dependent layout calculations from UI code.
      - Test representative small and large dimensions.
      - Add deterministic scale and alpha transforms for focused, first-neighbor, and second-neighbor positions.
    verification:
      automated:
        - JVM tests cover layout calculations at representative dimensions and five-card stacks.
        - UI tests cover configuration or size changes where supported.
      device:
        - Check a small phone and a larger screen during milestone validation.

  - id: US-009-REFINE
    title: Define fixed pager structure for interests and cards
    category: product
    priority: P1
    status: completed
    story:
      as_a: user
      i_want: the interests and cards to use clear horizontal and vertical pager structures
      so_that: navigation and the focused card position remain predictable
    acceptance_criteria:
      - The main product surface is an interests screen distinct from the settings screen.
      - The interests screen contains a compact top menu and a horizontal pager of interests.
      - The top menu has a centered plus action for adding a card and a settings action at the right.
      - Swiping left or right changes the active interest page.
      - Each interest page contains a vertical pager for its cards.
      - The vertical pager defines five stable presentation slots ordered from top to bottom as A, B, C, D, and E.
      - Slot C is always the centered, focused, opaque, and visually dominant slot.
      - Slots B and D are the first neighbors when those cards exist.
      - Slots A and E are the second neighbors when those cards exist.
      - The five presentation slots are distinct from the number of cards stored in an interest.
      - Changing focus repositions the card sequence into the same fixed slot geometry rather than moving the center slot.
    increments:
      - Document the interests-screen and settings-screen boundaries.
      - Define horizontal interest paging and vertical card paging as separate navigation axes.
      - Define the fixed five-slot geometry and center-focus invariant.
      - Map card collections of fewer than, equal to, and greater than five items onto the fixed slots.
    verification:
      automated:
        - Story-level tests define active-interest changes independently from focused-card changes.
        - Presentation tests define fixed slot positions for card collections of 0 through 7 items.
      device:
        - Confirm horizontal interest paging and vertical card paging remain distinguishable on a physical device.

  - id: US-009-REFINE-B
    title: Apply deterministic five-slot card transformations
    category: product
    priority: P1
    status: ready
    story:
      as_a: user
      i_want: each fixed card slot to have consistent responsive size and transparency
      so_that: the focused card remains visually dominant across supported devices
    acceptance_criteria:
      - Slot C has the largest scale and full opacity.
      - Slots B and D have matching scale and opacity values that are lower than slot C.
      - Slots A and E have matching scale and opacity values that are lower than slots B and D.
      - Slot transformations are derived from relative slot position and available layout size rather than hard-coded device dimensions.
      - Slot transformations are deterministic for a given layout size and slot position.
      - Missing cards leave their corresponding slots empty without shifting another card into slot C.
      - When fewer than five cards exist, the focused card remains in slot C and available neighbors retain their relative slots.
      - When more than five cards exist, only the focused card and its nearest two neighbors on each side occupy the five visible slots.
      - Restored focus from US-008 is rendered in slot C after process or app restart.
      - The settings screen is not treated as part of the five-slot card pager geometry.
    increments:
      - Define a testable slot-to-scale and slot-to-alpha transformation model.
      - Cover empty, one-card, three-card, five-card, and larger card collections.
      - Verify focus preservation and slot mapping after interest changes and persistence restoration.
      - Validate visual spacing and transparency at representative small and large layouts.
    verification:
      automated:
        - JVM tests cover symmetric transformations for A/B and D/E equivalents.
        - JVM tests cover fixed center anchoring and missing-slot behavior.
        - Compose UI tests cover five-slot rendering and interest/settings screen boundaries.
      device:
        - Confirm the five-slot composition, center dominance, and progressive transparency on a phone and a larger supported display.

  - id: US-014
    title: Provide a development-only state harness
    category: developer
    priority: P1
    status: ready
    story:
      as_a: developer
      i_want: to generate, reset, and inspect unusual card states in development
      so_that: navigation and persistence edge cases are quick to reproduce
    acceptance_criteria:
      - The harness is unavailable in production builds.
      - It can generate interests and cards of varied sizes.
      - It can reset generated data.
      - It can jump to a selected interest, card, and navigation mode.
      - It can disable or accelerate animations for debugging.
    increments:
      - Define a development-only interface for state generation.
      - Add deterministic fixtures for empty, boundary, and large datasets.
      - Keep generated data isolated from normal user data.
    verification:
      automated:
        - JVM tests cover generated fixture shapes and reset behavior.
      device:
        - Confirm the harness is absent from the production build variant.

  - id: US-015
    title: Automate Compose UI interaction coverage
    category: developer
    priority: P1
    status: completed
    story:
      as_a: developer
      i_want: Compose UI interactions to be covered by repeatable automation
      so_that: gesture, settings, visibility, and layout regressions are detected before device validation
    acceptance_criteria:
      - Compose UI tests can launch the main screen deterministically.
      - Tests can identify the settings control, settings option, return action, and navigation controls semantically.
      - Tests cover default hidden navigation controls.
      - Tests cover enabling and disabling navigation controls.
      - Tests cover the corrected card-button action mapping.
      - Tests remain separate from physical-device milestone verification.
    increments:
      - Create the Android Compose test source set and test rule.
      - Add stable semantics or test tags for settings and navigation controls.
      - Add focused tests for settings and navigation-button visibility.
      - Add focused tests for card-button action mapping and initial state.
    verification:
      automated:
        - ./gradlew connectedDebugAndroidTest
      device: []

definition_of_done:
  story:
    - Acceptance criteria are satisfied.
    - Relevant behavior has automated tests.
    - The smallest useful increment is independently reviewable.
  automated:
    - Relevant JVM and Android tests pass.
    - Configured lint checks pass.
    - The debug build succeeds.
  device:
    - Required Android-specific behavior has been exercised on a physical device.
    - Visual or gesture issues are resolved or explicitly tracked.
  delivery:
    - The diff is reviewed.
    - The story status is updated.
    - The increment is committed only after verification.

deferred_scope:
  - id: cloud-sync
    reason: Keep the first foundation local-first and account-free.
  - id: external-integrations
    reason: Avoid coupling the core model to external services.
  - id: alternate-layouts
    reason: Establish one spatial presentation before adding presentation modes.
  - id: anonymous-telemetry
    reason: Do not add data collection before the local interaction model is stable.
  - id: advanced-physics-controls
    reason: Defer a user-facing linear/circular physics toggle until baseline navigation is reliable.
  - id: rich-media-items
    reason: Start with a minimal card model; add media after persistence and navigation are stable.
  - id: android-project-scaffolding
    reason: This increment produces documentation only; project files are a subsequent story.